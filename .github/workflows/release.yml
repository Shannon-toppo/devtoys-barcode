name: Release

# Runs when a version tag such as v0.1.0-preview.1 is pushed: builds, tests, packs, and attaches the package to a
# GitHub release, then pushes it to nuget.org with Trusted Publishing: no API key is stored. nuget.org must have a
# trusted publishing policy for this repository and this workflow file (release.yml), and the repository needs a
# NUGET_USER secret holding the nuget.org user name (the profile name, not the email address).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write # lets the job ask GitHub for the OIDC token that nuget.org exchanges for a short-lived key

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up .NET SDKs
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Check that the tag matches the package version
        run: |
          version=$(grep -oP '(?<=<Version>)[^<]+' src/DevToys.Barcode/DevToys.Barcode.csproj)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Pack
        run: dotnet pack src/DevToys.Barcode -c Release --no-build -o artifacts

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md $prerelease

      # The key is valid for one hour and nuget.org versions cannot be replaced, so this comes last.
      - name: NuGet login (OIDC to a short-lived API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: dotnet nuget push artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
